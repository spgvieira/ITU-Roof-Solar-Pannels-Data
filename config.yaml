pv_csv: Datasets/PV/PV_DTU.csv
nwp_csv: Datasets/NWP/ECMWF_forecast_DTU.csv
target_columns: 
  - solar_power
forecast_columns:
  - temperature_2m
  - shortwave_radiation
  - direct_radiation
  - cloud_cover_low
  - cloud_cover_mid
  - cloud_cover_high
  - cloud_cover

train_set: {start: 2025-10-20 00:00:00, end: 2026-04-30 23:00:00}
val_set:   {start: 2026-05-01 00:00:00, end: 2026-06-30 23:00:00}
test_set:  {start: 2026-07-01 00:00:00, end: 2026-08-31 23:00:00}

latitude: 55.69
longitude: 12.10
grid_data: False

lstm:
  units: 64
  dropout: 0.2
  learning_rate: 0.001
  epochs: 100
  batch_size: 32
  forecast_period: 24
  history_period: 24

rf:
  n_estimators: 50
  max_depth: 8
  random_state: 0